name: Build & Publish Release (IntelliJ plugin)

# Mirrors the CLI's release workflow (blamely-cli/.github/workflows/release.yml):
# on a vX.Y.Z tag, build the plugin distribution zip and publish it to the SAME
# public release repo the CLI / other artifacts live in.
#
# This workflow ONLY builds the plugin zip and uploads it to the release repo.
# It deliberately does NOT publish to the JetBrains Marketplace — shipping to the
# Marketplace is a separate, MANUAL action: run the "Publish to JetBrains
# Marketplace" workflow (publish-marketplace.yml) by hand once you've verified the
# artifact built here. This keeps a tag push from auto-shipping to end users.
#
# Note: the GitHub release here is for archival + sideload ("Install Plugin from
# Disk") and is what the CLI's `blamely install` can download.
#
# How it triggers:
#   - Push a tag of the form `vX.Y.Z`.
#   - Or kick off manually via "Run workflow" (workflow_dispatch).
#
# Required secrets:
#   RELEASE_REPO        owner/repo of the PUBLIC release repo (e.g. blamely-ai/blamely)
#   RELEASE_REPO_TOKEN  fine-grained PAT with `contents: write` on RELEASE_REPO
#
# Artifacts published to RELEASE_REPO:
#   <tag> release:  blamely-intellij-<tag>.zip
#   latest release: blamely-intellij.zip   (stable name)

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v1.4.9). Required when running manually.'
        required: true
        type: string

permissions:
  contents: read   # release writes go to RELEASE_REPO via the PAT

jobs:
  release:
    name: build & publish plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build plugin
        run: ./gradlew buildPlugin --no-daemon -Pblamely.release=true

      - name: Stage distribution zip
        id: dist
        shell: bash
        run: |
          set -e
          zip="$(find build/distributions -maxdepth 1 -name '*.zip' | head -1)"
          if [ -z "$zip" ]; then echo "No zip in build/distributions"; exit 1; fi
          versioned="blamely-intellij-${{ steps.tag.outputs.tag }}.zip"
          cp "$zip" "$versioned"
          cp "$zip" blamely-intellij.zip   # stable name
          ls -la *.zip
          echo "versioned=$versioned" >> "$GITHUB_OUTPUT"

      - name: Publish to release repo
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
          RELEASE_REPO: ${{ secrets.RELEASE_REPO }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSIONED: ${{ steps.dist.outputs.versioned }}
        shell: bash
        run: |
          set -e
          if [ -z "$GH_TOKEN" ] || [ -z "$RELEASE_REPO" ]; then
            echo "Missing required secrets: RELEASE_REPO and/or RELEASE_REPO_TOKEN."
            exit 1
          fi
          gh release view "$TAG" --repo "$RELEASE_REPO" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$RELEASE_REPO" \
              --title "blamely $TAG" --generate-notes --verify-tag=false
          gh release upload "$TAG" --repo "$RELEASE_REPO" --clobber "$VERSIONED"

          gh release view latest --repo "$RELEASE_REPO" >/dev/null 2>&1 || \
            gh release create latest --repo "$RELEASE_REPO" \
              --title "Latest" \
              --notes "Rolling build from the most recent release." \
              --verify-tag=false
          gh release upload latest --repo "$RELEASE_REPO" --clobber blamely-intellij.zip

      # NOTE: this workflow only BUILDS the artifact and uploads it to the release
      # repo. It does NOT publish to the JetBrains Marketplace — that is a separate,
      # MANUAL step (run the "Publish to JetBrains Marketplace" workflow by hand).
